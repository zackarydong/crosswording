[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridfinder"
version = "0.1.0"
description = "Find 15x15 themeless crossword grid patterns that hold your seed entries"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gridfinder = "gridfinder.cli:main"

[tool.setuptools]
packages = ["gridfinder"]

[tool.setuptools.package-data]
gridfinder = ["default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
